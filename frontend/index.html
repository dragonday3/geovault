<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#16352c">
  <title>GeoVault</title>
  <link rel="preload" href="/vendor/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Leaflet 1.9.4 is vendored (served from our own origin) and pinned with SRI. -->
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#rail">Skip to panel</a>
  <div id="lab-banner" class="lab-banner" role="alert" hidden></div>

  <header class="topbar">
    <a class="wordmark" href="#/hall" aria-label="GeoVault, public hall">
      <svg class="wordmark-mark" aria-hidden="true"><use href="/icons.svg#mark"></use></svg>
      <span class="wordmark-text">GeoVault</span>
    </a>
    <div id="city-plates" class="city-plates" role="radiogroup" aria-label="City"></div>
    <div id="account-plate" class="account-plate"></div>
  </header>

  <main class="hall">
    <section class="map-frame" aria-label="Map">
      <div id="map" class="map"></div>
      <div id="map-banner" class="map-banner" hidden></div>
    </section>
    <aside id="rail" class="rail" tabindex="-1" aria-label="Panel">
      <nav id="rail-tabs" class="rail-tabs" aria-label="Sections"></nav>
      <div id="rail-body" class="rail-body"></div>
    </aside>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script src="/vendor/leaflet/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
