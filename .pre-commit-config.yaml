# Local guardrails run on every `git commit` (install once: py -3.10 -m pre_commit install).
# Hook revisions are pinned to commit SHAs (tags can be moved); comments show the version.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^data/raw/  # deliberate, SHA-256-manifested open-data snapshots (~3 MB each)
      - id: end-of-file-fixer
        exclude: ^(frontend/vendor|data/raw)/  # byte-exact files (SRI / SHA-256 verified)
      - id: trailing-whitespace
        exclude: ^(frontend/vendor|data/raw)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
