# GeoVault test stack — a SEPARATE compose project from the dev stack (docker-compose.yml).
#
#   docker compose -f compose.test.yml run --rm --build test
#   docker compose -f compose.test.yml down -v        # only ever touches geovault-test
#
# Its own project name means `down -v` here can never stop or delete the dev database.
# The test database lives in memory (tmpfs) on its own network; tests also refuse any DB
# host other than db-test/localhost (tests/conftest.py).
name: geovault-test

services:
  db-test:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    environment:
      POSTGRES_DB: geovault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GEOVAULT_DB_PASSWORD: ${GEOVAULT_DB_PASSWORD:?set GEOVAULT_DB_PASSWORD in .env}
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./db/init/20_app_role.sh:/docker-entrypoint-initdb.d/20_app_role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geovault"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [test]

  test:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: test
    image: geovault-api:test
    environment:
      GEOVAULT_DATABASE_URL: postgresql://geovault_app:${GEOVAULT_DB_PASSWORD}@db-test:5432/geovault
      GEOVAULT_JWT_SECRET: ${GEOVAULT_JWT_SECRET:?set GEOVAULT_JWT_SECRET in .env}
    depends_on:
      db-test:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [test]

networks:
  test:
